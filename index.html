<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stetik - Gestión profesional para trabajadores independientes. Agenda citas, usuarios, ventas y más." />
    
    <!-- Meta tags para prevenir caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://connect.facebook.net" />
    <meta name="theme-color" content="#c25173" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stetik" />
    <meta property="og:title" content="Stetik - Tu agenda se llena sola" />
    <meta property="og:description" content="Citas, usuarios, cobros y recordatorios por WhatsApp. Gratis para empezar." />
    <meta property="og:image" content="https://www.stetik.app/favicon.svg" />
    <title>Stetik - Agenda, clientes y recordatorios por WhatsApp</title>
    <style>
      /* Se ve al instante mientras carga la app (en datos móviles puede tardar unos segundos). */
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-family: system-ui, sans-serif; background: #faf7f5; color: #44403c; }
      #boot img { width: 56px; height: 56px; }
      #boot .bar { width: 120px; height: 4px; border-radius: 4px; background: #f3e8e6; overflow: hidden; }
      #boot .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #c25173; animation: boot 1s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: translateX(-10%); } to { transform: translateX(160%); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/favicon.svg" alt="" /><strong style="font-size:22px">Stetik</strong><div class="bar"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
